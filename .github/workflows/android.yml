name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main, "phase-*", "feature/**"]
  pull_request:
    branches: [main]
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Verify preview keystore loads
        run: keytool -list -keystore .ci/preview-signing.p12 -storetype PKCS12 -storepass android
      - name: Unit tests (all modules, Android and PC targets)
        run: |
          if ! ./gradlew testDebugUnitTest desktopTest --stacktrace > unit-tests.log 2>&1; then
            grep -E '^e: |FAILED|AssertionError|What went wrong' -A2 unit-tests.log | grep -v '^--$' | head -40 | sed -e 's#/home/runner/work/[^/]*/[^/]*/##' | while IFS= read -r line; do echo "::error::${line}"; done
            tail -40 unit-tests.log
            exit 1
          fi
      - name: Android lint
        run: |
          if ! ./gradlew lintDebug --stacktrace > lint.log 2>&1; then
            { grep -hE ': Error: ' $(find . -path '*lint*' -name '*.txt' 2>/dev/null) 2>/dev/null; grep -E '^e: |What went wrong' -A2 lint.log; } | grep -v '^--$' | head -40 | sed -e 's#/home/runner/work/[^/]*/[^/]*/##' | while IFS= read -r line; do echo "::error::${line}"; done
            tail -40 lint.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results-debug.*
      - name: Build preview APKs
        run: |
          if ! ./gradlew :app:assembleDebug --stacktrace > debug.log 2>&1; then
            grep -E '^e: |ERROR|What went wrong' -A2 debug.log | grep -v '^--$' | head -40 | sed -e 's#/home/runner/work/[^/]*/[^/]*/##' | while IFS= read -r line; do echo "::error::${line}"; done
            tail -40 debug.log
            exit 1
          fi
      - name: Build release (shrinker check, unsigned unless a release key is configured)
        run: |
          if ! ./gradlew :app:assembleRelease --stacktrace > release.log 2>&1; then
            # Surface the cause as annotations so it is readable without the full log.
            grep -E '^e: |ERROR|Missing class|What went wrong|Error: |Lint found' -A2 release.log | grep -v '^--$' | head -40 | sed -e 's#/home/runner/work/[^/]*/[^/]*/##' | while IFS= read -r line; do echo "::error::${line}"; done
            report=$(ls app/build/intermediates/lint_vital_intermediate_text_report/release/*/lint-results-release.txt 2>/dev/null | head -1)
            [ -n "$report" ] && grep -E ': Error: ' "$report" | head -20 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -60 release.log
            exit 1
          fi
      - name: Report APK size
        run: |
          apk=app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          echo "::notice title=APK size::PhotoVault-arm64 $(( $(stat -c %s "$apk") / 1048576 )) MB"
      - uses: actions/upload-artifact@v4
        with:
          # The one to install on phones and tablets.
          name: PhotoVault-preview-arm64-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error

  # The same screens as a Windows PC app. Proves the shared code builds for the PC port.
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Windows app (ready-to-run folder with its own Java runtime)
        shell: bash
        run: |
          if ! ./gradlew :desktop:createDistributable --stacktrace > desktop.log 2>&1; then
            grep -E '^e: |ERROR|What went wrong' -A2 desktop.log | grep -v '^--$' | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -40 desktop.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          # Unzip and run PhotoVault.exe. Not signed, so Windows SmartScreen may ask once.
          name: PhotoVault-windows
          path: desktop/build/compose/binaries/main/app/PhotoVault/
          if-no-files-found: error
